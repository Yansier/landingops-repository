# LandingOps dedicated read-only account policy.
# This lexically early fragment prevents another Match block from supplying a
# first value for the same account. Installation still requires sshd -t and
# sshd -T -C verification against the server's actual Include order.
Match User landingops-audit
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AuthenticationMethods publickey
    AuthorizedKeysFile .ssh/authorized_keys
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    AuthorizedPrincipalsFile none
    HostbasedAuthentication no
    GSSAPIAuthentication no
    # Ubuntu 24.04/OpenSSH 9.6 rejects PermitUserEnvironment inside Match.
    # The boundary checker therefore requires the inherited effective value
    # to remain "no" before reload and for every audited source context.
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
    PermitTunnel no
    ForceCommand /usr/local/libexec/landingops-readonly-wrapper
